<text x="86" y="624" font-family="Arial, Liberation Sans, sans-serif" font-size="29" fill="#202833" font-weight="700" text-anchor="start">Una forma distinta de mirar</text>
<text x="86" y="668" font-family="Arial, Liberation Sans, sans-serif" font-size="22" fill="#202833" font-weight="400" text-anchor="start">Las calles cuentan historias que a menudo pasan desapercibidas.</text>
<text x="86" y="701" font-family="Arial, Liberation Sans, sans-serif" font-size="22" fill="#202833" font-weight="400" text-anchor="start">Una plaza, una biblioteca o un paseo de barrio pueden convertirse</text>
<text x="86" y="734" font-family="Arial, Liberation Sans, sans-serif" font-size="22" fill="#202833" font-weight="400" text-anchor="start">en una oportunidad para detenernos y observar.</text>
<text x="86" y="789" font-family="Arial, Liberation Sans, sans-serif" font-size="22" fill="#202833" font-weight="400" text-anchor="start">Leer con calma permite relacionar ideas y encontrar preguntas</text>
<text x="86" y="822" font-family="Arial, Liberation Sans, sans-serif" font-size="22" fill="#202833" font-weight="400" text-anchor="start">nuevas. Por eso, cada persona puede elegir la apariencia que le</text>
<text x="86" y="855" font-family="Arial, Liberation Sans, sans-serif" font-size="22" fill="#202833" font-weight="400" text-anchor="start">resulte más cómoda.</text>
